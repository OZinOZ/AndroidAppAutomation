# Continuous integration for the appautomation package.
#
# Runs on every push to `main` and every pull request:
#   1. lint with ruff (syntax errors, undefined names, unused imports/variables);
#   2. run the unit test suite with coverage (no device / OCR engine needed);
#   3. publish a coverage summary and keep the XML report as an artifact.
#
# The package is installed with `pip install -e ".[dev]"` so the tests run
# against the installed package exactly like a user would get it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (errors only)
        run: |
          ruff check --select E9,F --no-cache src tests examples

      - name: Run tests with pytest
        run: |
          pytest -v --cov=appautomation --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: python scripts/coverage_summary.py coverage.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
