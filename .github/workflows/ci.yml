# Continuous integration for the appautomation package.
#
# Runs on every push to `main` and every pull request:
#   1. lint with ruff (syntax errors, undefined names, unused imports/variables);
#   2. run the unit test suite with pytest (no device / OCR engine needed).
#
# The package is installed with `pip install -e ".[dev]"` so the tests run
# against the installed package exactly like a user would get it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff (errors only)
        run: |
          pip install ruff
          ruff check --select E9,F --no-cache src tests examples

      - name: Run tests with pytest
        run: pytest -v
